<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade: Dashboard de Estudos</title>


    <style>
        /* 💡 DICA: Escreva seus estilos CSS aqui embaixo! */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            padding: 20px;
        }

        .dashboard {
    display: flex;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
}

.sidebar{
    flex: 1;
    min-height: 250px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    border-radius: 16px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 15px 25px rgba(236, 72, 153,0.3);
}

.nav-item{
    background: rgba(255, 255, 255, 0.2);
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.nav-item:hover{
    background: rgba(255, 255, 255, 0.4);
    transform: translateX(5px);

}

.main-content{
    flex: 3;
    display: flex;
    flex-direction: column;
    gap: 20px;

}

.stats-container{
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.card{
    flex: 1;
    min-width: 300px;
    padding: 20px;
    border-radius: 16px;
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.card h3{
    font-size:14px;
    opacity: 0.9;
    text-transform: uppercase;
}

.card p{
    font-size: 26px;
    font-weight: bold;
}

.stat-1{
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
}
.stat-2{
    background: linear-gradient(135deg, #10b981, #047857);
}
.stat-3{
    background: linear-gradient(135deg, #f59e0b, #b45309);
}

.content-container{
    display: flex;
    gap: 20px;
    flex-wrap: wrap;   
}

.box{
    flex: 1;
    min-width: 200px;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px; 
}

.box h3{
    font-size: 20px;
    color: #38bdf8;
    border-bottom: 2px solid #334155;
    padding-bottom: 10px;
}

@media (max-width: 900px) {
    .dashboard-container{
        flex-direction: column;
    }
}
    </style>
</head>
<body>

    <!-- Container Principal do Dashboard -->
    <div class="dashboard">
        
        <!-- Menu Lateral -->
        <div class="sidebar">
            <h3>📖 Meus Estudos</h3>
            <div class="nav-item">Dashboard</div>
            <div class="nav-item">Matérias</div>
            <div class="nav-item">Simulados</div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="main-content">
            
            <!-- Seção de Estatísticas -->
            <div class="stats-container">
                <div class="card stat-1">
                    <h4>Horas Estudadas</h4>
                    <p>48h</p>
                </div>
                <div class="card stat-2">
                    <h4>Simulados Feitos</h4>
                    <p>12</p>
                </div>
                <div class="card stat-3">
                    <h4>Média de Acertos</h4>
                    <p>85%</p>
                </div>
            </div>

            <!-- Seção de Blocos de Conteúdo -->
            <div class="content-container">
                <div class="box">
                    <h3>Metas da Semana</h3>
                    <p>Concluir o módulo de Flexbox e praticar CSS Grid.</p>
                </div>
                <div class="box">
                    <h3>Próxima Aula</h3>
                    <p>JavaScript Básico - Funções e Eventos.</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
